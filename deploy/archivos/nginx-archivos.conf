# /etc/nginx/sites-available/archivos  — publica el servidor de archivos con HTTPS
# Reemplaza archivos.tudominio.com por tu subdominio y luego ejecuta:
#   sudo ln -s /etc/nginx/sites-available/archivos /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d archivos.tudominio.com
server {
    listen 80;
    server_name archivos.tudominio.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8333;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
