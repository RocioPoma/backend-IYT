# Servidor de archivos compatible con S3 (SeaweedFS) para el VPS de Contabo.
# Los archivos quedan en /opt/iyt-archivos/data del servidor.
# Uso:  docker compose up -d
services:
  archivos:
    image: chrislusf/seaweedfs:4.53
    container_name: iyt-archivos
    restart: unless-stopped
    command: >
      server
      -dir=/data
      -ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=1024
      -volume.max=0
      -s3
      -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json
    ports:
      # Solo accesible desde el propio servidor; Nginx lo publica con HTTPS
      - "127.0.0.1:8333:8333"
    volumes:
      - /opt/iyt-archivos/data:/data
      - ./s3.json:/etc/seaweedfs/s3.json:ro
